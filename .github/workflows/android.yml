name: Build Android APK

on:
  push:
    branches: [ "main", "master", "*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release and Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug
          gradle assembleRelease || true

      - name: Verify APK Generation
        run: |
          ls -la app/build/outputs/apk/debug/
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Debug APK successfully generated!"
          else
            echo "Error: Debug APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doubletap-apk-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/
